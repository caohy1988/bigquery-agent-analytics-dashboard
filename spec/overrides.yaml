# Reviewed decision layer — the ONLY hand-maintained spec input.
#
# Two-layer design (PR #1 review): spec/dashboard_spec.yaml is always
# regenerated from the pinned LookML, so M0/M2 decisions live HERE and are
# merged in by tools/lookml_to_spec.py, keyed by stable record IDs. The
# generator fails on any key referencing an unknown ID or an unknown
# property (referential integrity), and CI drift checks cover this file the
# same as every committed artifact.
#
# Populated as decisions are frozen:
#   decisions.call_row_policy       — M0 evidence (raw_row | terminal_row_per_key)
#   decisions.page_dimensions       — M2 (fixed page size, e.g. {width: 1200, height: 900})
#   decisions.screenshot_viewport   — M2 (fixed viewport for reference screenshots)
#   decisions.listener_design       — frozen M0 design: page_level_parity |
#                                     data_source_aliases | global_controls_with_exceptions
#   decisions.listener_design_detail — the selected design's data: aliases +
#                                     chart_alias_assignments (design 2),
#                                     control_groups, intentional_exceptions
#                                     (each with rationale), inspector_persistence
#   charts.<id>.oracle_query        — M0 oracle mapping (path under oracle/queries/)
#   charts.<id>.expected_results    — M0 oracle expected-result matrix:
#                                     [{scenario, profiles, path, comparison, tolerance}]
#   charts.<id>.screenshot_id       — M4 promoted regression golden
#   charts.<id>.ls_chart            — reviewed refinement of the initial
#                                     Looker Studio chart-type hypothesis
#   controls.<id>.placement         — control placement (page | report)
#
# Malformed sections (lists, scalars) fail generation — see
# tools/test_spec_contract.py.

decisions:
  # FROZEN (M0): raw_row — direct-view aggregation with distinct-key call
  # counts. NOTE: this is an INTENTIONAL DIVERGENCE from the pinned block
  # on the repeated-key population — the block's one_to_one explore join
  # fans out n×n on streaming partial/final rows sharing a span (measured:
  # direct 6,994 rows / 17.4M tokens vs join shape 9,280 / 23.1M on the
  # committed scenario). Exact parity holds only where the one-to-one key
  # assumption holds; the fan-out expectation is recorded separately.
  # terminal_row_per_key remains a v1.1 candidate.
  # Full rationale + measurements: docs/decisions/call-row-policy.md,
  # evidence/repeated-key-divergence.md
  call_row_policy: raw_row
  page_dimensions: null
  screenshot_viewport: null
  listener_design: null
  listener_design_detail: null

