name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: looker-open-source/agent-analytics-block
          ref: fe6423cc9775b6dc61f7f7047dd4424603ddb3a1
          path: .block-pinned

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install 'pyyaml==6.0.2' 'jsonschema==4.23.0'

      # The manifest and SQL artifacts are generated; CI proves the committed
      # files match a fresh regeneration (no hand edits, no drift).
      - name: Regenerate manifest from pinned block
        run: |
          python3 tools/lookml_to_spec.py \
            --block-repo .block-pinned \
            --pinned-commit fe6423cc9775b6dc61f7f7047dd4424603ddb3a1 \
            --out spec/dashboard_spec.yaml

      - name: Regenerate union template and render sentinels
        run: |
          python3 tools/gen_events_tmpl.py
          python3 tools/render_template.py
          python3 tools/render_web_config.py

      - name: Regenerate oracle queries
        run: python3 oracle/gen_oracle.py

      - name: Assert no generated-file drift
        run: git diff --exit-code

      - name: Validate manifest against schema and assertions
        run: python3 tools/validate_spec.py

      - name: Seed generator structural tests
        run: python3 tools/test_seed_events.py

      - name: Token metadata compatibility contract
        run: python3 tools/test_token_contract.py

      - name: Public dashboard hydration contract
        run: |
          python3 tools/test_hydrate_dashboard.py
          node tools/test_web_configurator.mjs

      - name: Spec contract negative tests
        run: python3 tools/test_spec_contract.py .block-pinned

      - name: Fabricated-evidence rejection test
        run: python3 tools/test_validate_evidence.py

      - name: Provenance fail-closed tests
        run: python3 tools/test_provenance.py

      - name: Comparator adversarial tests
        run: python3 tools/test_runner_compare.py

      - name: Validate inventory evidence (fingerprints + profile sets)
        run: python3 tools/validate_inventories.py

      - name: Lint
        # Pin the policy engine: unversioned `pipx run ruff` changed its
        # default rule set between otherwise identical CI runs.
        run: pipx run --spec 'ruff==0.11.2' ruff check tools/ oracle/

  # Fails while evidence/.refresh-in-progress exists: the M0 evidence set
  # is absent or being regenerated, and that state must be RED, not green
  # (PR #1 sixth review). Removed together with the refreshed artifacts.
  m0-evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'pyyaml==6.0.2'
      - name: Content-aware evidence validation
        run: python3 tools/validate_evidence.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
